<div id="auction-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-md"></div>

    <div class="relative bg-no-repeat bg-center bg-cover border-4 border-amber-900 rounded-3xl shadow-2xl"
         style="width: 1100px; height: 700px; background-image: url('/static/images/全空背景.png');">

        <div id="panel-tiles-bg" class="absolute bg-no-repeat"
             style="background-image: url('/static/images/棕色.png'); 
                    background-size: 100% 100%; background-position: left top;
                    width: 1000px; height: 140px; left: 50px; top: 200px;">
        </div>

        <div id="auction-track-grid" class="absolute flex flex-wrap gap-6 justify-start items-start"
             style="left: 130px; top: 210px; width: 940px; height: 140px;">
        </div>

        <div id="panel-gen" class="absolute bg-no-repeat bg-center bg-contain flex items-center justify-center text-black font-black text-2xl"
             style="background-image: url('/static/images/棕色.png'); width: 220px; height: 70px; left: 60px; top: 100px;">第 0 世代</div>
        <div id="panel-player" class="absolute bg-no-repeat bg-center bg-contain flex items-center justify-center text-black font-black text-2xl"
             style="background-image: url('/static/images/棕色.png'); width: 220px; height: 70px; left: 300px; top: 100px;">玩家 1</div>
        <div id="panel-ra" class="absolute bg-no-repeat bg-center bg-contain flex items-center justify-center text-black font-black text-2xl"
             style="background-image: url('/static/images/棕色.png'); width: 220px; height: 70px; left: 540px; top: 100px;">RA: 0 / 9</div>
        <div id="panel-suns" class="absolute bg-no-repeat bg-center bg-contain flex items-center justify-center text-black font-black text-2xl"
             style="background-image: url('/static/images/棕色.png'); width: 220px; height: 70px; left: 780px; top: 100px;">中央籌碼: 0</div>

        <div id="auction-suns-bg" class="absolute bg-no-repeat flex items-center px-6"
             style="background-image: url('/static/images/競標籌碼區.png'); 
                    background-size: 100% 100%;
                    width: 700px; height: 60px; left: 80px; top: 360px;">
             
             <div class="flex flex-row items-center w-full h-full gap-4">
                 <div class="text-black font-black text-2xl whitespace-nowrap">可用之籌碼:</div>
                 <div class="flex flex-row items-center gap-3" id="auction-modal-suns-box"></div>
             </div>
        </div>

        <div id="auction-pass-container" class="absolute flex items-center" 
             style="top: 360px; left: 800px;">
        </div>

        <div id="players-area" class="absolute flex flex-col items-center gap-4" 
             style="top: 430px; left: 0; right: 0; margin: auto; width: 800px;">
        </div>
    </div>
</div>

<script>
    function getTileImageUrl(type, value) {
        const basePath = '/static/images/tiles/';
        const safeValue = parseInt(value, 10) || 1;
        const safeType = parseInt(type, 10);
        switch(safeType) {
            case 0: return `${basePath}ra.png`;
            case 1: return `${basePath}pharaoh.png`;
            case 3: return `${basePath}nile.png`;
            case 6: return `${basePath}god.png`;
            case 7: return `${basePath}gold.png`;
            case 8: return `${basePath}flood.png`;
            case 4: 
                const civTypes = { 1: 'fire', 2: 'field', 3: 'text', 4: 'star', 5: 'paint' };
                return `${basePath}civ_${civTypes[safeValue] || 'generic'}.png`;
            case 5: return `${basePath}pyramid_type_${safeValue}.png`;
            default: return `${basePath}generic.png`;
        }
    }

    function updatePanelTexts(generation, playerIdx, raCount, currentSuns) {
        document.getElementById('panel-gen').innerText = `第 ${generation || 0} 世代`;
        document.getElementById('panel-player').innerText = `玩家 ${playerIdx + 1}`;
        document.getElementById('panel-ra').innerText = `RA: ${raCount} / 9`;
        document.getElementById('panel-suns').innerText = `中央籌碼: ${currentSuns}`;
    }

    function openAuctionModal() {
        const modal = document.getElementById('auction-modal');
        if (!modal) return;
        if (!gameState.auction_active || gameState.auction_active === 0) { modal.classList.add('hidden'); return; }
        modal.classList.remove('hidden');

        updatePanelTexts(gameState.current_epoch, gameState.current_bidder, gameState.sun_boat_position, gameState.center_sun);

        // 1. 渲染軌道
        const container = document.getElementById('auction-track-grid');
        container.innerHTML = '';
        (gameState.auction_track || []).forEach(tile => {
            const wrapper = document.createElement('div');
            wrapper.className = "flex flex-col items-center gap-1 w-20";
            const img = document.createElement('img');
            img.src = getTileImageUrl(tile.type, tile.value);
            img.className = "w-20 h-20 rounded-xl border-2 border-amber-500 shadow-lg bg-gray-900 transition hover:scale-105";
            const nameLabel = document.createElement('p');
            nameLabel.innerText = cleanTileName(tile.display_name);
            nameLabel.className = "text-black font-black text-[18px] bg-amber-100/90 px-1 py-0.5 rounded shadow-sm text-center w-full truncate";
            wrapper.appendChild(img);
            wrapper.appendChild(nameLabel);
            container.appendChild(wrapper);
        });

        // 2. 渲染籌碼與 Pass 按鈕
        const sunsContainer = document.getElementById('auction-modal-suns-box');
        const passContainer = document.getElementById('auction-pass-container');
        sunsContainer.innerHTML = '';
        passContainer.innerHTML = '';
        
        const bidder = gameState.players ? gameState.players.find(p => p.player_id == gameState.current_bidder) : null;
        
        if (bidder) {
            (bidder.active_suns || []).forEach(sunVal => {
                if (sunVal <= 0) return;
                const btn = document.createElement('button');
                if (gameState.highest_bid && sunVal <= gameState.highest_bid) {
                    btn.className = "bg-gray-800 text-gray-500 px-5 py-2 rounded-lg border border-gray-700 cursor-not-allowed";
                    btn.disabled = true;
                } else {
                    btn.className = "bg-amber-500 hover:bg-amber-400 text-black font-bold px-5 py-2 rounded-lg shadow transition active:scale-95";
                    btn.onclick = () => submitSingleBid(bidder.player_id, sunVal);
                }
                btn.innerText = ` ${sunVal}`;
                sunsContainer.appendChild(btn);
            });

            // Pass 按鈕
            const passBtn = document.createElement('button');
            passBtn.className = "bg-no-repeat bg-center bg-contain flex items-center justify-center font-bold text-black transition-transform duration-300 hover:scale-105 active:scale-95 w-32 h-14";
            passBtn.style = "background-image: url('/static/images/btn_orange.png'); background-size: 100% 100%;";
            passBtn.innerText = "✋ Pass";
            passBtn.onclick = () => submitSingleBid(bidder.player_id, 0);
            passContainer.appendChild(passBtn);
        }

        // 3. 渲染玩家狀態區
        const cellWidth = "w-60";
        const cellHeight = "h-14";
        
        const playersArea = document.getElementById('players-area');
        playersArea.innerHTML = '';
        const players = gameState.players || [];
        const pCount = players.length;

        const createPlayerCell = (text) => {
            const div = document.createElement('div');
            div.className = `${cellWidth} ${cellHeight} bg-no-repeat bg-center bg-contain flex items-center justify-center font-black text-black text-xl`;
            div.style = "background-image: url('/static/images/玩家區.png'); background-size: 100% 100%;";
            div.innerText = text;
            return div;
        };

        if (pCount <= 3) {
            const row = document.createElement('div');
            row.className = "flex flex-row gap-4 justify-center";
            players.forEach((p, idx) => row.appendChild(createPlayerCell(`玩家 ${idx + 1}`)));
            playersArea.appendChild(row);
        } else if (pCount === 4) {
            for(let i=0; i<2; i++) {
                const row = document.createElement('div');
                row.className = "flex flex-row gap-4 justify-center";
                for(let j=0; j<2; j++) row.appendChild(createPlayerCell(`玩家 ${i*2 + j + 1}`));
                playersArea.appendChild(row);
            }
        } else if (pCount === 5) {
            const row1 = document.createElement('div');
            row1.className = "flex flex-row gap-4 justify-center";
            for(let i=0; i<3; i++) row1.appendChild(createPlayerCell(`玩家 ${i + 1}`));
            playersArea.appendChild(row1);

            const row2 = document.createElement('div');
            row2.className = "flex flex-row gap-4 justify-center";
            for(let i=3; i<5; i++) row2.appendChild(createPlayerCell(`玩家 ${i + 1}`));
            playersArea.appendChild(row2);
        }

        // 4. 渲染當前最高出價 (已將文字放大至 text-2xl)
        const statusText = document.createElement('div');
        statusText.className = "mt-4 text-black font-bold text-3xl text-center";
        statusText.innerText = gameState.highest_bid > 0 
            ? `當前最高出價: ${gameState.highest_bid} (玩家 ${gameState.highest_bidder + 1})` 
            : "當前最高出價: 暫無 (皆為 Pass)";
        playersArea.appendChild(statusText);
    }
</script>
