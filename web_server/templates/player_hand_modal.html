<div id="player-hand-modal" 
     class="fixed inset-0 bg-gray-950/85 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300" 
     onclick="if(event.target === this) closeHandModal()">
    
    <div class="relative rounded-2xl shadow-2xl transform scale-95 transition-transform duration-300 overflow-hidden border border-gray-700"
         style="
            width: 1200px;        /* 🛠️ 自訂整個大面板的寬度 */
            height: 760px;        /* 🛠️ 自訂整個大面板的高度 */
         ">
        
        <img id="hand-board-bg" 
             src="/static/images/手牌畫面.png" 
             alt="Board Background"
             class="absolute inset-0 w-full h-full block select-none pointer-events-none object-fill z-0"
        />

        <div id="hand-tiles-board" class="absolute inset-0 pointer-events-none z-30 isolate">
            </div>

        <button onclick="closeHandModal()" 
                class="absolute top-4 right-4 z-40 text-gray-400 hover:text-white bg-black/50 hover:bg-black/80 font-bold text-xl px-3 py-1 rounded-full transition duration-150 border border-white/10 shadow-lg">
            ✕
        </button>
        
    </div>
</div>

<script>
    // 🎯 【18 種具體板塊的獨立控制表：包含位置(top, left)、個別寬高(w, h)與獨立間距(gap)】
    // 💡 調整 gap 參數即可控制該板塊與下方數字的垂直距離（例如：'28px'、'16px'）
    const TILE_POSITIONS = {
        // --- 基礎板塊 (已移除 Ra) ---
        "1_1": { top: '26.6%', left: '50.3%', w: '100px', h: '110px', gap: '28px' }, // 法老 Pharaoh
        "3_1": { top: '26.6%', left: '33.6%', w: '100px', h: '110px', gap: '28px' }, // 尼羅河 Nile
        "6_1": { top: '26.6%', left: '83.7%', w: '100px', h: '110px', gap: '28px' }, // 神明 God
        "7_1": { top: '26.6%', left: '67%',   w: '100px', h: '110px', gap: '28px' }, // 金幣 Gold
        "8_1": { top: '26.6%', left: '16.8%', w: '100px', h: '110px', gap: '28px' }, // 洪水 Flood

        // --- 5 種文明板塊 (Type 4) ---
        "4_1": { top: '52%', left: '33.6%', w: '100px', h: '110px', gap: '28px' },  // 文明-火 Fire
        "4_2": { top: '52%', left: '16.8%', w: '100px', h: '110px', gap: '28px' },  // 文明-農業 Field
        "4_3": { top: '52%', left: '83.7%', w: '100px', h: '110px', gap: '28px' },  // 文明-文學 Text
        "4_4": { top: '52%', left: '50.3%', w: '100px', h: '110px', gap: '28px' },  // 文明-天文 Star
        "4_5": { top: '51.8%', left: '67%',   w: '100px', h: '115px', gap: '28px' },  // 文明-藝術 Paint

        // --- 8 種建築板塊 (Type 5) ---
        "5_1": { top: '77%', left: '16.8%', w: '100px', h: '110px', gap: '29px' },  // 建築 1
        "5_2": { top: '77%', left: '36%', w: '100px', h: '110px', gap: '29px' },  // 建築 2
        "5_3": { top: '77%', left: '45.4%', w: '100px', h: '110px', gap: '29px' },  // 建築 3
        "5_4": { top: '77%', left: '55.2%', w: '100px', h: '110px', gap: '29px' },  // 建築 4
        "5_5": { top: '77%', left: '64.4%', w: '100px', h: '110px', gap: '29px' },  // 建築 5
        "5_6": { top: '77%', left: '74.4%', w: '100px', h: '110px', gap: '29px' },  // 建築 6
        "5_7": { top: '77%', left: '26.4%', w: '100px', h: '110px', gap: '29px' },  // 建築 7
        "5_8": { top: '77%', left: '83.8%', w: '100px', h: '110px', gap: '29px' }   // 建築 8
    };

    // 🎯 【圖片路徑對照函式】
    function getTileImageUrl(type, value) {
        const basePath = '/static/images/tiles/';
        const safeValue = parseInt(value, 10) || 1;
        const safeType = parseInt(type, 10);

        switch(safeType) {
            case 0: return `${basePath}ra.png`;
            case 1: return `${basePath}pharaoh.png`;
            case 3: return `${basePath}nile.png`;
            case 6: return `${basePath}god.png`;
            case 7: return `${basePath}gold.png`;
            case 8: return `${basePath}flood.png`;

            case 4: // 🌾 文明
                const civTypes = { 1: 'fire', 2: 'field', 3: 'text', 4: 'star', 5: 'paint' };
                return `${basePath}civ_${civTypes[safeValue] || 'generic'}.png`;

            case 5: // 📐 建築
                return `${basePath}pyramid_type_${safeValue}.png`;

            default:
                return `${basePath}generic.png`;
        }
    }

    function openHandModal(playerIdx) {
        if (!gameState || !gameState.players) return;
        const player = gameState.players.find(p => p.player_id == playerIdx);
        if (!player) return;

        // 初始化 18 種具體板塊的計數器
        const detailedCounts = {};
        Object.keys(TILE_POSITIONS).forEach(key => {
            detailedCounts[key] = 0;
        });

        // 讀取玩家當前手牌計算數量
        if (player.hand_tiles && player.hand_tiles.length > 0) {
            player.hand_tiles.forEach(tile => {
                const t = parseInt(tile.type, 10);
                const v = parseInt(tile.value, 10) || 1;
                const key = `${t}_${v}`;
                
                if (detailedCounts[key] !== undefined) {
                    detailedCounts[key]++;
                }
            });
        }

        const boardContainer = document.getElementById('hand-tiles-board');
        boardContainer.innerHTML = '';

        // 遍歷渲染 18 個獨立的彩色板塊
        Object.keys(TILE_POSITIONS).forEach(key => {
            const pos = TILE_POSITIONS[key];
            const parts = key.split('_');
            const typeId = parseInt(parts[0], 10);
            const valueId = parseInt(parts[1], 10);
            
            const currentCount = detailedCounts[key];
            const imgUrl = getTileImageUrl(typeId, valueId);
            
            // 抓取個別設定值
            const tileW = pos.w || '55px';
            const tileH = pos.h || '55px';
            const customGap = pos.gap || '16px'; // 若沒設定則預設 16px

            // 🎯 style="row-gap: ${customGap};"：由內聯樣式精準控制個別數字推開的距離
            const itemHtml = `
                <div class="absolute pointer-events-auto select-none transition-all duration-300 flex flex-col items-center"
                     style="top: ${pos.top}; left: ${pos.left}; transform: translate(-50%, -50%); row-gap: ${customGap};">
                    
                    <img src="${imgUrl}" 
                         alt="tile-${key}" 
                         class="rounded-lg object-fill block drop-shadow-[0_4px_6px_rgba(0,0,0,0.4)]"
                         style="width: ${tileW}; height: ${tileH};" 
                    />
                    
                    <span class="text-black text-xl font-black tracking-wide text-center leading-none">
                        ${currentCount}
                    </span>
                </div>
            `;
            boardContainer.insertAdjacentHTML('beforeend', itemHtml);
        });

        // 開啟面版
        const modal = document.getElementById('player-hand-modal');
        const content = modal.querySelector('div');
        modal.classList.remove('hidden');
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
        }, 10);
    }

    function closeHandModal() {
        const modal = document.getElementById('player-hand-modal');
        const content = modal.querySelector('div');
        modal.classList.add('opacity-0');
        content.classList.add('scale-95');
        setTimeout(() => { modal.classList.add('hidden'); }, 200);
    }
</script>
