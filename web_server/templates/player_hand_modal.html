<div id="player-hand-modal" 
     class="fixed inset-0 bg-gray-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200" 
     onclick="if(event.target === this) closeHandModal()">
    
    <div class="bg-gray-800 border border-gray-700 w-full max-w-lg p-6 rounded-2xl shadow-2xl transform scale-95 transition-transform duration-200 flex flex-col max-h-[85vh]">
        
        <div class="flex justify-between items-center border-b border-gray-700/70 pb-3 mb-4">
            <h3 id="hand-modal-title" class="text-base sm:text-lg font-black text-yellow-400 flex items-center gap-2">
                📋 玩家板塊資產清單
            </h3>
            <button onclick="closeHandModal()" class="text-gray-400 hover:text-gray-100 text-xl font-bold p-1 transition">
                ✕
            </button>
        </div>

        <div class="flex-1 overflow-y-auto pr-1 scrollbar-thin scrollbar-thumb-gray-700">
            <div id="hand-tiles-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                </div>
            
            <div id="hand-empty-hint" class="text-center py-12 text-gray-500 italic text-sm hidden">
                <div class="text-3xl mb-2">🏜️</div>
                該玩家目前兩手空空，趕快去贏一池拍賣吧！
            </div>
        </div>

        <div class="border-t border-gray-700/70 mt-4 pt-3 flex justify-end">
            <button onclick="closeHandModal()" 
                    class="bg-gray-700 hover:bg-gray-600 text-gray-200 font-bold px-6 py-2 rounded-xl text-xs transition shadow active:scale-95">
                關閉視窗
            </button>
        </div>
    </div>
</div>

<script>
    function openHandModal(playerIdx) {
        // 安全檢查：防範 gameState 未載入完成
        if (!gameState || !gameState.players) return;
        const player = gameState.players.find(p => p.player_id == playerIdx);
        if (!player) return;

        // 1. 動態更新標題
        document.getElementById('hand-modal-title').innerHTML = `
            <span>📋 玩家 ${playerIdx + 1} 持有明細</span>
            <span class="text-xs font-normal text-gray-400 bg-gray-900 px-2 py-0.5 rounded-full border border-gray-700">
                共 ${player.hand_count} 張
            </span>
        `;

        // 2. 清空並準備渲染
        const listContainer = document.getElementById('hand-tiles-list');
        const emptyHint = document.getElementById('hand-empty-hint');
        listContainer.innerHTML = '';

        if (!player.hand_tiles || player.hand_tiles.length === 0) {
            emptyHint.classList.remove('hidden');
        } else {
            emptyHint.classList.add('hidden');
            
            // 3. 遍歷手牌進行渲染
            player.hand_tiles.forEach(tile => {
                let badgeStyle = "bg-gray-900/50 text-gray-300 border-gray-700";
                
                // 德式美術風格上色 (美化邊框與字體對比)
                if (tile.type === 1) badgeStyle = "bg-sky-950/40 text-sky-400 border-sky-800/60";      // 法老 (藍)
                if (tile.type === 3 || tile.type === 8) badgeStyle = "bg-blue-950/40 text-blue-400 border-blue-800/60"; // Nile / Flood (深藍)
                if (tile.type === 4) badgeStyle = "bg-emerald-950/40 text-emerald-400 border-emerald-800/60"; // 文明 (綠)
                if (tile.type === 5) badgeStyle = "bg-amber-950/40 text-amber-400 border-amber-800/60";   // 金字塔 (黃)
                if (tile.type === 7) badgeStyle = "bg-yellow-500/10 text-yellow-400 border-yellow-600/30"; // 金幣 (金黃)
                if (tile.type === 6) badgeStyle = "bg-purple-950/40 text-purple-400 border-purple-800/60"; // 神明 (紫)
                if (tile.type === 2) badgeStyle = "bg-rose-950/30 text-rose-400 border-rose-900/50";       // 災難 (紅/粉)

                const tileHtml = `
                    <div class="border ${badgeStyle} px-3.5 py-3 rounded-xl font-bold text-xs flex justify-between items-center shadow-sm hover:brightness-110 transition duration-150">
                        <span class="truncate pr-2">${tile.name}</span>
                        <span class="text-[9px] uppercase font-mono tracking-wider opacity-40 bg-black/20 px-1.5 py-0.5 rounded">
                            T-${tile.type}
                        </span>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', tileHtml);
            });
        }

        // 4. 動畫流暢開啟彈窗
        const modal = document.getElementById('player-hand-modal');
        const content = modal.querySelector('div');
        
        modal.classList.remove('hidden');
        // 透過 setTimeout 避開瀏覽器渲染優化，順暢觸發 CSS Transition
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
        }, 10);
    }

    function closeHandModal() {
        const modal = document.getElementById('player-hand-modal');
        const content = modal.querySelector('div');
        
        modal.classList.add('opacity-0');
        content.classList.add('scale-95');
        
        // 等待淡出動畫結束後再隱藏 DOM 節點
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 200);
    }
</script>
