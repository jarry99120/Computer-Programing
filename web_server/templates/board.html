{% extends 'base.html' %}

{% block title %}遊戲圖板 — 太陽神 Ra{% endblock %}

{% block content %}
<style>
    /* 🔲 方形板塊核心外觀設定 */
    .auction-tile {
        width: 100%;
        height: 110px;
        /* 完美正方形高度調整，可配合響應式 */
        border-radius: 12px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);

        /* 🎯 背景圖縮放核心 */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        /* 懸浮放大微互動 */
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .auction-tile:hover {
        transform: scale(1.06) translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
    }

    /* 🔒 空格子的預留外框線條 */
    .tile-placeholder {
        height: 110px;
        border: 2px dashed rgba(75, 85, 99, 0.5);
        /* 灰 600 半透明 */
        border-radius: 12px;
        background-color: rgba(17, 24, 39, 0.3);
        /* 灰 900 半透明 */
    }
</style>

<div class="max-w-7xl mx-auto px-4 py-8 animate-[fadeIn_0.4s_ease-out]">

    <div
        class="bg-gray-800 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-center border border-gray-700 gap-4 mb-6 shadow-lg relative">
        <div class="flex flex-wrap gap-6 text-lg font-bold justify-center">
            <span id="lbl-epoch"
                class="text-yellow-400 bg-yellow-400/10 px-3 py-1 rounded-md border border-yellow-400/20">載入中...</span>
            <span id="lbl-ra-track" class="text-red-400 bg-red-400/10 px-3 py-1 rounded-md border border-red-400/20">Ra
                軌道: -</span>
            <span id="lbl-center-sun"
                class="text-teal-400 bg-teal-400/10 px-3 py-1 rounded-md border border-teal-400/20">中央籌碼: [-]</span>
        </div>

        <div class="flex items-center gap-4">
            <div id="lbl-current-turn"
                class="text-lg font-black bg-gradient-to-r from-amber-500 to-yellow-500 text-gray-900 px-6 py-1.5 rounded-full shadow">
                讀取中...
            </div>
            <button onclick="returnToMainMenu()"
                class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-4 py-1.5 rounded-xl text-sm shadow-md transition transform active:scale-95 flex items-center gap-1">
                🚪 返回主選單
            </button>
        </div>
    </div>

    <div class="bg-gray-800/80 backdrop-blur p-6 rounded-2xl border border-gray-700 mb-8 shadow-xl text-center">
        <h2 class="text-lg font-bold mb-4 text-gray-400 uppercase tracking-wider">拍賣區 (Auction Track)</h2>

        <div id="auction-track-box" class="grid grid-cols-4 sm:grid-cols-8 gap-4 justify-center min-h-[110px] mb-6">
        </div>

        <div id="action-buttons-group" class="flex flex-wrap justify-center gap-4">
            <button id="btn-draw" onclick="drawTile()"
                class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-3 rounded-xl text-lg shadow-lg transition active:scale-95">🎲
                抽牌</button>
            <button id="btn-call-ra" onclick="callRa()"
                class="bg-orange-600 hover:bg-orange-500 text-white font-bold px-8 py-3 rounded-xl text-lg shadow-lg transition active:scale-95">
                召喚 RA</button>
            <button id="btn-use-god" onclick="useGodTile()"
                class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-8 py-3 rounded-xl text-lg shadow-lg transition active:scale-95">🏛️
                使用神明板塊</button>
        </div>
    </div>

    <h2 class="text-xl font-bold mb-4 text-gray-400 px-1">👥 玩家陣營面板 <span
            class="text-xs font-normal text-gray-500 ml-2">(💡 提示：點擊玩家面板可檢視資產)</span></h2>
    <div id="players-board" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-4 mb-6"></div>
</div>

{% include 'auction_modal.html' %}
{% include 'player_hand_modal.html' %}

<div id="result-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
    <div class="relative bg-amber-100 border-4 border-amber-900 rounded-3xl p-8 shadow-2xl w-[450px] text-center">
        <h2 class="text-3xl font-black text-amber-900 mb-6 tracking-widest">競標結果</h2>
        <div id="result-content" class="text-2xl font-bold text-gray-800 mb-8 leading-relaxed"></div>
        <button onclick="document.getElementById('result-modal').classList.add('hidden')"
            class="bg-amber-800 text-white px-8 py-3 rounded-xl font-bold hover:bg-amber-700 transition shadow-lg active:scale-95">
            太棒了 (關閉)
        </button>
    </div>
</div>
<script>
    // --- 補上這段定義，確保 showResultModal 可被全域呼叫 ---
    // ✅ 強制在最頂端宣告，確保範圍最廣
    window.showResultModal = function (winnerId, bidAmount) {
        console.log("DEBUG: showResultModal 函式被呼叫了！"); // 檢查是否成功觸發
        const modal = document.getElementById('result-modal');
        const content = document.getElementById('result-content');

        if (!modal) {
            console.error("錯誤：找不到 #result-modal DOM 元素");
            return;
        }

        if (bidAmount > 0) {
            content.innerHTML = `恭喜 <span class="text-amber-900 text-3xl">玩家 ${winnerId + 1}</span><br>以 <span class="text-red-600 text-3xl">${bidAmount}</span> 籌碼贏得本次競標！`;
        } else {
            content.innerText = "本次競標無人出價（皆為 Pass）。";
        }

        modal.classList.remove('hidden');
    };
    function cleanTileName(name) {
        if (!name) return "";
        return name.split('(')[0].trim();
    }
    // ----------------------------------------------------
    let gameState = null;
    let isGodExchangeMode = false; // 🎯 追蹤目前玩家是否點擊了神明板塊，處於等待選取交換卡牌的模式

    // 網頁開啟時，主動跟後端同步最新遊戲狀態
    window.addEventListener('DOMContentLoaded', fetchCurrentState);

    async function fetchCurrentState() {
        let res = await fetch('/api/state');
        if (res.status === 400) {
            window.location.href = '/';
            return;
        }
        gameState = await res.json();
        renderUI();
    }

    // =================================================================
    // 🗺️ 動態圖片對照路由解析函式 (已整合最新災難與文明規則)
    // =================================================================
    function getTileImageUrl(type, value) {
        const basePath = '/static/images/tiles/';

        const safeValue = parseInt(value, 10) || 1;
        const safeType = parseInt(type, 10);

        switch (safeType) {
            case 0: return `${basePath}ra.png`;
            case 1: return `${basePath}pharaoh.png`;
            case 3: return `${basePath}nile.png`;
            case 6: return `${basePath}god.png`;
            case 7: return `${basePath}gold.png`;
            case 8: return `${basePath}flood.png`;

            case 2: // 🌋 災難板塊
                const disasters = {
                    1: 'drought',       // disaster_drought.png
                    2: 'earthquake',    // disaster_earthquake.png
                    3: 'pharaoh_dies',  // disaster_pharaoh_dies.png
                    4: 'war'            // disaster_war.png
                };
                return `${basePath}disaster_${disasters[safeValue] || 'generic'}.png`;

            case 4: // 🌾 文明板塊
                const civTypes = {
                    1: 'fire',   // civ_fire.png
                    2: 'field',  // civ_field.png
                    3: 'text',   // civ_text.png
                    4: 'star',   // civ_star.png
                    5: 'paint'   // civ_paint.png
                };
                return `${basePath}civ_${civTypes[safeValue] || 'generic'}.png`;

            case 5: // 📐 建築板塊
                return `${basePath}pyramid_type_${safeValue}.png`;

            default:
                return `${basePath}generic.png`;
        }
    }

    // =================================================================
    // 🎨 UI 核心渲染渲染器
    // =================================================================
    function renderUI() {
        if (!gameState) return;

        // 1. 刷新頂部狀態數據
        document.getElementById('lbl-epoch').innerText = `第 ${gameState.current_epoch} 時代`;
        document.getElementById('lbl-ra-track').innerText = `Ra 軌道: ${gameState.sun_boat_position}/9`;
        document.getElementById('lbl-center-sun').innerText = `中央籌碼: [${gameState.center_sun}]`;

        // 2. 判斷遊戲狀態提示
        let turnLbl = document.getElementById('lbl-current-turn');
        if (gameState.game_over) {
            turnLbl.innerText = `🏁 遊戲結束！`;
            turnLbl.className = "text-lg font-black bg-red-600 text-white px-6 py-1.5 rounded-full shadow animate-pulse";
            document.getElementById('action-buttons-group').innerHTML = `<button onclick="window.location.href='/'" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-8 py-3 rounded-xl text-lg transition">返回大廳</button>`;
        } else if (isGodExchangeMode) {
            // 🎯 新增：神明交換模式狀態提示
            turnLbl.innerText = `🏛️ 請選擇拍賣區的一張板塊進行交換...`;
            turnLbl.className = "text-lg font-black bg-purple-600 text-white px-6 py-1.5 rounded-full shadow animate-pulse";
        } else if (gameState.auction_active) {
            turnLbl.innerText = ` 競標進行中...`;
            turnLbl.className = "text-lg font-black bg-purple-600 text-white px-6 py-1.5 rounded-full shadow animate-pulse";
        } else {
            turnLbl.innerText = `玩家 ${gameState.current_player + 1} 的回合`;
            turnLbl.className = "text-lg font-black bg-gradient-to-r from-amber-500 to-yellow-500 text-gray-900 px-6 py-1.5 rounded-full shadow";
        }

        // 3. 🎯 渲染拍賣軌 8 格「方形實體卡牌圖片」
        let trackBox = document.getElementById('auction-track-box');
        trackBox.innerHTML = '';

        for (let i = 0; i < 8; i++) {
            if (i < gameState.auction_track.length) {
                let tile = gameState.auction_track[i];
                let cell = document.createElement('div');

                // 🎯 如果目前正處於「神明交換模式」，將卡牌加上紫色高亮閃爍外框、調整指針手勢
                if (isGodExchangeMode) {
                    cell.className = "auction-tile border-2 border-purple-400 animate-pulse cursor-pointer ring-4 ring-purple-500/30";
                    cell.setAttribute('onclick', `executeGodExchange(${i}, '${tile.name}')`);
                } else {
                    cell.className = "auction-tile border border-gray-700/60 cursor-help";
                }

                const currentType = (tile.type_id !== undefined) ? tile.type_id : tile.type;
                const currentValue = (tile.value_id !== undefined) ? tile.value_id : tile.value;

                let imgUrl = getTileImageUrl(currentType, currentValue);
                cell.style.backgroundImage = `url('${imgUrl}')`;
                // 在 renderUI 函式中搜尋 cell.title，改為：
                cell.title = `${cleanTileName(tile.name)} (Type: ${currentType}, Value: ${currentValue})`;

                trackBox.appendChild(cell);
            } else {
                let placeholder = document.createElement('div');
                placeholder.className = "tile-placeholder flex items-center justify-center text-gray-700 font-bold text-xs select-none";
                placeholder.innerText = `格 ${i + 1}`;
                trackBox.appendChild(placeholder);
            }
        }

        // 4. 渲染各玩家陣營面板卡片
        let pBoard = document.getElementById('players-board');
        pBoard.innerHTML = '';
        gameState.players.forEach((p, idx) => {
            let isCurrent = (idx === gameState.current_player && !gameState.auction_active);
            let isCurrentBidder = (idx === gameState.current_bidder && gameState.auction_active);

            let borderClass = "border-gray-700 bg-gray-800/60 text-gray-300";
            if (isCurrent) borderClass = "border-yellow-500 bg-yellow-950/20 text-white shadow-[0_0_15px_rgba(234,179,8,0.15)]";
            if (isCurrentBidder) borderClass = "border-purple-500 bg-purple-950/20 text-white shadow-[0_0_15px_rgba(168,85,247,0.15)]";

            let card = document.createElement('div');
            card.className = `p-5 rounded-2xl border transition-all duration-200 hover:scale-[1.02] hover:bg-gray-800 cursor-pointer ${borderClass}`;
            card.setAttribute('onclick', `openHandModal(${p.player_id})`);

            card.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full ${isCurrent ? 'bg-yellow-400 animate-pulse' : (isCurrentBidder ? 'bg-purple-400 animate-pulse' : 'bg-gray-600')}"></span>
                        <span class="text-base font-black ${isCurrent ? 'text-yellow-400' : 'text-gray-200'}">玩家 ${idx + 1} ${isCurrent ? '👑' : ''}</span>
                    </div>
                    <span class="text-xs px-2 py-0.5 rounded-full font-black bg-amber-500 text-gray-950 shadow-sm">💰 ${p.score} 分</span>
                </div>
                
                <div class="space-y-2 text-xs">
                    <p class="text-gray-400 flex justify-between items-center bg-gray-900/40 p-1.5 rounded border border-gray-700/30">
                        <span>擁有手牌板塊：</span>
                        <span class="font-bold text-yellow-400 text-sm">${p.hand_count} 張 🔍</span>
                    </p>
                    
                    <div class="pt-2 mt-1 border-t border-gray-700/50 space-y-2">
                        <div>
                            <span class="block text-[10px] uppercase font-bold text-emerald-400 tracking-wider mb-1">▶ 本時代可用籌碼</span>
                            <div class="flex flex-wrap gap-1 min-h-[22px]">
                                ${p.active_suns.map(s => `
                                    <span class="bg-emerald-500/10 text-emerald-400 font-extrabold border border-emerald-500/30 px-2 py-0.5 rounded-md text-[10px] shadow-sm">
                                         ${s}
                                    </span>
                                `).join('') || '<span class="text-gray-500 italic text-[10px]">已無可用籌碼</span>'}
                            </div>
                        </div>
                        
                        <div>
                            <span class="block text-[10px] uppercase font-bold text-gray-500 tracking-wider mb-1">⏳ 已翻面鎖定 (下時代解鎖)</span>
                            <div class="flex flex-wrap gap-1 min-h-[22px]">
                                ${p.used_suns.map(s => `
                                    <span class="bg-gray-900 text-gray-500 border border-gray-800 px-2 py-0.5 rounded-md text-[10px] line-through flex items-center gap-0.5 opacity-60 shadow-inner">
                                        🔒 ${s}
                                    </span>
                                `).join('') || '<span class="text-gray-600 italic text-[10px]">無</span>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            pBoard.appendChild(card);
        });

        // 5. 核心按鈕狀態控管優化（同步納入神明按鈕與交換模式判定）
        const drawBtn = document.getElementById('btn-draw');
        const raBtn = document.getElementById('btn-call-ra');
        const godBtn = document.getElementById('btn-use-god');

        if (gameState.auction_active || isGodExchangeMode) {
            const disabledClass = "bg-gray-700 text-gray-500 font-bold px-8 py-3 rounded-xl text-lg shadow cursor-not-allowed opacity-40";
            if (drawBtn) drawBtn.className = disabledClass;
            if (raBtn) raBtn.className = disabledClass;

            if (godBtn) {
                if (isGodExchangeMode) {
                    // 處於交換狀態中時，允許點擊原按鈕來取消交換
                    godBtn.className = "bg-rose-600 hover:bg-rose-500 text-white font-bold px-8 py-3 rounded-xl text-lg shadow-lg transition active:scale-95";
                    godBtn.innerText = "❌ 取消神明交換";
                    godBtn.disabled = false;
                } else {
                    godBtn.className = disabledClass;
                    godBtn.disabled = true;
                }
            }
        } else {
            if (drawBtn) drawBtn.className = "bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-3 rounded-xl text-lg shadow-lg transition active:scale-95";
            if (raBtn) raBtn.className = "bg-orange-600 hover:bg-orange-500 text-white font-bold px-8 py-3 rounded-xl text-lg shadow-lg transition active:scale-95";

            // 💡 防禦判定：如果當前玩家手牌中沒有神明板塊（Type ID: 6），或者拍賣軌是空的，就停用按鈕
            const curPlayerStruct = gameState.players[gameState.current_player];
            const hasGodTile = curPlayerStruct && curPlayerStruct.hand_tiles && curPlayerStruct.hand_tiles.some(t => t.type === 6);
            const hasAuctionItems = gameState.auction_track && gameState.auction_track.length > 0;

            if (godBtn) {
                godBtn.innerText = "🏛️ 使用神明板塊";
                if (hasGodTile && hasAuctionItems) {
                    godBtn.className = "bg-purple-600 hover:bg-purple-500 text-white font-bold px-8 py-3 rounded-xl text-lg shadow-lg transition active:scale-95";
                    godBtn.disabled = false;
                } else {
                    godBtn.className = "bg-gray-700 text-gray-500 font-bold px-8 py-3 rounded-xl text-lg shadow cursor-not-allowed opacity-40";
                    godBtn.disabled = true;
                }
            }
        }

        // 6. 雙重檢查機制
        if (gameState.auction_active) {
            const modal = document.getElementById('auction-modal');
            if (modal && (modal.classList.contains('hidden') || modal.style.display === 'none' || window.getComputedStyle(modal).display === 'none')) {
                if (typeof openAuctionModal === "function") {
                    console.log("🔄 [防呆同步] 狀態機為活躍，強制呼叫競標彈窗。");
                    openAuctionModal();
                }
            }
        }
    }

    // =================================================================
    // 🎲 玩家行動 API 異步串接
    // =================================================================
    async function drawTile() {
        if (gameState && gameState.auction_active) {
            alert(" 目前正處於太陽神競標程序中！請先完成出價，不可抽牌。");
            return;
        }

        let res = await fetch('/api/draw', { method: 'POST' });
        let data = await res.json();

        gameState = data.game_state;
        renderUI();

        if (gameState && gameState.auction_active) {
            if (gameState.auction_count >= 8) {
                alert("🚨 警告：拍賣軌道 8 格已滿！天神發怒，立刻強制進入大會競標程序！");
            }
            else if (data.drawn_tile && data.drawn_tile.type === 0) {
                alert(" 抽到太陽神 Ra 板塊！全體玩家請進入競標對話框出價！");
            }
            else if (gameState.forced_auction) {
                alert("🏛️ 太陽神事件觸發強制競標！");
            }

            if (typeof openAuctionModal === "function") {
                openAuctionModal();
            }
        }
    }

    async function callRa() {
        if (gameState && gameState.auction_active) {
            alert(" 目前已經在競標中了！");
            return;
        }

        let res = await fetch('/api/invoke_auction', { method: 'POST' });
        if (res.status === 400) { alert((await res.json()).error || "無法發起競標"); return; }
        let data = await res.json();

        gameState = data.game_state;
        renderUI();

        if (gameState.auction_active && typeof openAuctionModal === "function") {
            openAuctionModal();
        }
    }

    // 🎯 點擊主按鈕：切換是否進入「選擇目標板塊模式」
    function useGodTile() {
        if (!gameState) return;
        if (gameState.auction_active) {
            alert(" 競標進行中，無法執行神明板塊特殊行動！");
            return;
        }

        // 翻轉狀態，重新刷新畫面（此時卡牌會開始閃亮）
        isGodExchangeMode = !isGodExchangeMode;
        renderUI();
    }

    // 🎯 真正選取了某個特定板塊後，向後端發送一換一交易
    async function executeGodExchange(trackIndex, tileName) {
        const confirmUse = confirm(`🏛️ 確定要消耗一張「神明板塊」，來單獨換取拍賣區中的【${cleanTileName(tileName)}】嗎？\n(此行動經確認會立刻執行並結束你的回合)`);
        if (!confirmUse) return;

        try {
            let res = await fetch('/api/use_god_tile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    player_id: gameState.current_player,
                    track_index: parseInt(trackIndex, 10) // 💡 傳遞玩家挑選的格子索引 (0 ~ 7)
                })
            });

            let data = await res.json();
            if (res.ok && data.success) {
                alert(`🏛️ 神蹟顯靈！成功換取【${tileName}】！`);
                isGodExchangeMode = false; // 交易成功，關閉交換模式
                gameState = data.game_state;
                renderUI();
            } else {
                alert("❌ 行動失敗：" + (data.error || "不符合使用條件"));
                isGodExchangeMode = false;
                renderUI();
            }
        } catch (error) {
            console.error("Error using god tile:", error);
            alert("伺服器通訊錯誤，無法執行神明行動。");
            isGodExchangeMode = false;
            renderUI();
        }
    }

    async function returnToMainMenu() {
        const confirmLeave = confirm("⚠️ 確定要結束目前的遊戲並返回主畫面嗎？\n目前的遊戲進度將會遺失！");
        if (!confirmLeave) return;

        try {
            let res = await fetch('/api/restart', { method: 'POST' });
            let data = await res.json();
            if (data.status === "success") {
                window.location.href = '/';
            } else {
                alert("重置遊戲失敗：" + data.message);
            }
        } catch (error) {
            console.error("Error resetting game:", error);
            window.location.href = '/';
        }
    }
    // ... 放在 board.html 原有的 script 區塊中，renderUI 函式之後 ...

    async function submitSingleBid(playerId, bidAmount) {
        console.log(`發送出價請求：玩家 ${playerId}，金額 ${bidAmount}`);

        try {
            const response = await fetch('/api/submit_bid', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    player_id: parseInt(playerId),
                    bid_value: parseInt(bidAmount)
                })
            });

            const data = await response.json();

            if (response.ok && data.status === "success") {
                const wasAuctionActive = (gameState.auction_active !== 0);
                gameState = data.game_state;
                renderUI();

                const isAuctionJustEnded = (wasAuctionActive && gameState.auction_active === 0);

                if (isAuctionJustEnded) {
                    const auctionModal = document.getElementById('auction-modal');
                    if (auctionModal) auctionModal.classList.add('hidden');

                    // 這裡改用 window.showResultModal 確保一定呼叫得到
                    window.showResultModal(gameState.highest_bidder, gameState.highest_bid);
                } else {
                    openAuctionModal();
                }
            } else {
                alert("出價失敗：" + (data.message || "未知錯誤"));
            }
        } catch (error) {
            console.error("Error submitting bid:", error);
            alert("無法連線至伺服器，請檢查後端日誌。");
        }
    }
</script>
{% endblock %}
