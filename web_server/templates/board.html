{% extends 'base.html' %}

{% block title %}遊戲圖板 — 太陽神 Ra{% endblock %}

{% block content %}
<style>
    /* 🛠️ 參數設定區 (在這裡微調數值即可) */
    :root {
        --bg-url: url('/static/images/全空背景.png');
        --bg-size: 1500px 810px;
        /* 設定背景填滿整個視窗 */

        /* 每個面板的位置 (修改 left / top 即可移動) */
        --pos-epoch-left: 180px;
        --pos-epoch-top: 80px;

        --pos-turn-left: 490px;
        --pos-turn-top: 80px;

        --pos-ra-left: 800px;
        --pos-ra-top: 80px;

        --pos-sun-left: 1110px;
        --pos-sun-top: 80px;

        --auction-board-width: 1000px;
        --auction-board-height: 250px;
    }

    /* 🔒 鎖定螢幕設定 */
    body {
        background-image: var(--bg-url);
        background-size: var(--bg-size);
        background-attachment: fixed;
        background-position: center;
        background-repeat: no-repeat;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        /* 禁止整個頁面滾動 */
    }

    /* 🪵 統一的棕色面板樣式 */
    .brown-panel {
        background-image: url('/static/images/棕色.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        background-position: center;
        width: 220px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: black;
        font-weight: 900;
        font-size: 1.25rem;
        position: absolute;
        /* 固定在背景上方 */
        z-index: 10;
    }

    /* 根據變數應用位置 */
    #lbl-epoch {
        left: var(--pos-epoch-left);
        top: var(--pos-epoch-top);
    }

    #lbl-current-turn {
        left: var(--pos-turn-left);
        top: var(--pos-turn-top);
    }

    #lbl-ra-track {
        left: var(--pos-ra-left);
        top: var(--pos-ra-top);
    }

    #lbl-center-sun {
        left: var(--pos-sun-left);
        top: var(--pos-sun-top);
    }

    /* 返回按鈕容器 */
    .menu-btn-container {
        position: absolute;
        top: 70px;
        right: 50px;
        z-index: 10;
    }

    /* 🚀 遊戲主要內容區域 (內容若過多，將自動在此區域內滾動) */
    .main-container {
        position: absolute;
        top: 150px;
        /* 修改這裡：數值越小，距離上面越近 */
        left: 0;
        right: 0;
        bottom: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        /* 已鎖定滾動 */
    }

    /* 拍賣區塊樣式 */
    .auction-track-wrapper {
        background-color: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 16px;
        padding: 24px;
        max-width: 1000px;
        width: 90%;
        text-align: center;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        margin-bottom: 30px;
    }

    /* 方形板塊 */
    .auction-tile {
        width: 100px;
        height: 110px;
        border-radius: 12px;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        transition: transform 0.2s;
    }

    .auction-tile:hover {
        transform: scale(1.05);
    }

    .brown-track-panel {
        background-image: url('/static/images/棕色.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        width: 1000px;
        /* 直接寫死寬度 */
        min-height: 150px;
        display: flex;
        align-items: center;
        /* 讓卡片垂直置中 */
        justify-content: flex-start;
        padding-left: 90px;
        gap: 20px;
        margin: 0 auto;
        position: relative;
    }

    /* 確保卡片內的文字標籤樣式與 Modal 一致 */
    .tile-name-label {
        font-size: 14px;
        font-weight: 900;
        background-color: rgba(255, 241, 201, 0.9);
        /* 淺色半透明底 */
        color: black;
        text-align: center;
        width: 80px;
        border-radius: 4px;
        margin-top: 4px;
    }

    /* 自訂按鈕樣式 */
    .custom-orange-btn {
        /* 這裡改成英文檔名 */
        background-image: url('/static/images/btn_orange.png');

        background-size: 100% 100%;
        background-repeat: no-repeat;
        background-position: center;

        /* 備用顏色：如果圖片讀取失敗，按鈕會變成橘色，這樣你才知道它有成功套用樣式 */
        background-color: orange;

        width: 150px;
        height: 55px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: black;
        font-weight: 900;
        border: none;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .custom-orange-btn:hover {
        filter: brightness(1.1);
        /* 滑鼠懸停時微亮 */
        transform: scale(1.05);
    }

    .custom-orange-btn:active {
        transform: scale(0.95);
    }

    .custom-orange-btn:disabled {
        filter: grayscale(1) brightness(0.7);
        cursor: not-allowed;
        transform: none;
    }

    .custom-player-card {
        /* 如果不想改檔名，請確保這裡的檔名與圖片檔完全一致 */
        background-image: url('/static/images/玩家區.png');
        background-size: 100% 100%;
        /* 強制拉伸填滿 */
        background-repeat: no-repeat;

        /* 移除原本的背景色，讓圖片完整顯示 */
        background-color: transparent;

        /* 設定內距確保內容不會黏邊 */
        padding: 20px;
        border-radius: 16px;
        border: 2px solid transparent;
        /* 預設邊框透明 */
        transition: all 0.2s;
    }

    /* 針對選中狀態的樣式調整 (用亮框代替背景色，避免遮住圖片) */
    .player-card-active {
        border-color: #fbbf24;
        /* 金黃色邊框 */
        box-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
    }

    .player-card-bidder {
        border-color: #a855f7;
        /* 紫色邊框 */
        box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
    }
</style>

<div id="lbl-epoch" class="brown-panel">第 1 時代</div>
<div id="lbl-current-turn" class="brown-panel">玩家 1 的回合</div>
<div id="lbl-ra-track" class="brown-panel">RA: 0 / 9</div>
<div id="lbl-center-sun" class="brown-panel">中央籌碼: [1]</div>

<div class="main-container">
    <div id="auction-track-box" class="brown-track-panel">
    </div>

    <div id="action-buttons-group" class="flex flex-wrap justify-center gap-6 mt-8 mb-8">
        <button id="btn-draw" onclick="drawTile()" class="custom-orange-btn">抽牌</button>
        <button id="btn-call-ra" onclick="callRa()" class="custom-orange-btn">召喚 RA</button>
        <button id="btn-use-god" onclick="useGodTile()" class="custom-orange-btn">使用神明板塊</button>
    </div>
    <div id="players-board" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-4 mb-6"></div>
</div>

{% include 'auction_modal.html' %}
{% include 'player_hand_modal.html' %}

<div id="result-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60"></div>
    <div class="relative border-4 border-amber-900 rounded-3xl p-8 shadow-2xl w-[450px] text-center bg-amber-50">
        <h2 class="text-3xl font-black text-amber-900 mb-6 tracking-widest">競標結果</h2>
        <div id="result-content" class="text-2xl font-bold text-gray-800 mb-8 leading-relaxed"></div>
        <button onclick="document.getElementById('result-modal').classList.add('hidden')"
            class="bg-amber-800 text-white px-8 py-3 rounded-xl font-bold hover:bg-amber-700 transition shadow-lg active:scale-95">
            太棒了 (關閉)
        </button>
    </div>
</div>
<div id="menu-btn-container" class="fixed bottom-[10px] right-[90px] z-[100]">
    <button onclick="returnToMainMenu()" class="custom-orange-btn !w-[180px] !h-[60px]">
        返回主選單
    </button>
</div>

<script>
    // --- 補上這段定義，確保 showResultModal 可被全域呼叫 ---
    window.showResultModal = function (winnerId, bidAmount) {
        console.log("DEBUG: showResultModal 函式被呼叫了！");
        const modal = document.getElementById('result-modal');
        const content = document.getElementById('result-content');

        if (!modal) {
            console.error("錯誤：找不到 #result-modal DOM 元素");
            return;
        }

        if (bidAmount > 0) {
            content.innerHTML = `恭喜 <span class="text-amber-900 text-3xl">玩家 ${winnerId + 1}</span><br>以 <span class="text-red-600 text-3xl">${bidAmount}</span> 籌碼贏得本次競標！`;
        } else {
            content.innerText = "本次競標無人出價（皆為 Pass）。";
        }

        modal.classList.remove('hidden');
    };
    function cleanTileName(name) {
        if (!name) return "";
        return name.split('(')[0].trim();
    }
    // ----------------------------------------------------
    let gameState = null;
    let isGodExchangeMode = false;

    window.addEventListener('DOMContentLoaded', fetchCurrentState);

    async function fetchCurrentState() {
        let res = await fetch('/api/state');
        if (res.status === 400) {
            window.location.href = '/';
            return;
        }
        gameState = await res.json();
        renderUI();
    }

    function getTileImageUrl(type, value) {
        const basePath = '/static/images/tiles/';
        const safeValue = parseInt(value, 10) || 1;
        const safeType = parseInt(type, 10);

        switch (safeType) {
            case 0: return `${basePath}ra.png`;
            case 1: return `${basePath}pharaoh.png`;
            case 3: return `${basePath}nile.png`;
            case 6: return `${basePath}god.png`;
            case 7: return `${basePath}gold.png`;
            case 8: return `${basePath}flood.png`;

            case 2:
                const disasters = {
                    1: 'drought',
                    2: 'earthquake',
                    3: 'pharaoh_dies',
                    4: 'war'
                };
                return `${basePath}disaster_${disasters[safeValue] || 'generic'}.png`;

            case 4:
                const civTypes = {
                    1: 'fire',
                    2: 'field',
                    3: 'text',
                    4: 'star',
                    5: 'paint'
                };
                return `${basePath}civ_${civTypes[safeValue] || 'generic'}.png`;

            case 5:
                return `${basePath}pyramid_type_${safeValue}.png`;

            default:
                return `${basePath}generic.png`;
        }
    }

function renderUI() {
    if (!gameState) return;

    // 1. 更新頂部資訊面板
    document.getElementById('lbl-epoch').innerText = `第 ${gameState.current_epoch} 時代`;
    document.getElementById('lbl-ra-track').innerText = `RA: ${gameState.sun_boat_position} / 9`;
    document.getElementById('lbl-center-sun').innerText = `中央籌碼: ${gameState.center_sun}`;

    let turnLbl = document.getElementById('lbl-current-turn');
    if (gameState.game_over) {
        turnLbl.innerText = `遊戲結束`;
    } else {
        turnLbl.innerText = `玩家 ${gameState.current_player + 1} 的回合`;
    }

    // 2. 渲染拍賣區
    let trackBox = document.getElementById('auction-track-box');
    trackBox.innerHTML = ''; 

    for (let i = 0; i < 8; i++) {
        if (i < gameState.auction_track.length) {
            let tile = gameState.auction_track[i];
            let wrapper = document.createElement('div');
            wrapper.className = "flex flex-col items-center w-20";

            let img = document.createElement('div');
            if (isGodExchangeMode) {
                img.className = "w-20 h-20 rounded-xl border-2 border-purple-400 animate-pulse cursor-pointer ring-4 ring-purple-500/30";
                img.setAttribute('onclick', `executeGodExchange(${i}, '${tile.name}')`);
            } else {
                img.className = "w-20 h-20 rounded-xl border-2 border-amber-500 shadow-lg bg-gray-900";
            }

            const currentType = (tile.type_id !== undefined) ? tile.type_id : tile.type;
            const currentValue = (tile.value_id !== undefined) ? tile.value_id : tile.value;
            img.style.backgroundImage = `url('${getTileImageUrl(currentType, currentValue)}')`;
            img.style.backgroundSize = "cover";

            let nameLabel = document.createElement('p');
            nameLabel.innerText = cleanTileName(tile.display_name || tile.name);
            nameLabel.className = "text-[12px] font-black bg-amber-100/90 text-black px-1 py-0.5 rounded shadow-sm text-center w-full truncate mt-1";

            wrapper.appendChild(img);
            wrapper.appendChild(nameLabel);
            trackBox.appendChild(wrapper);
        }
    }

    // 3. 渲染玩家陣營面板
    let pBoard = document.getElementById('players-board');
    pBoard.innerHTML = '';
    gameState.players.forEach((p, idx) => {
        let isCurrent = (idx === gameState.current_player && !gameState.auction_active);
        let isCurrentBidder = (idx === gameState.current_bidder && gameState.auction_active);

        let statusClass = "";
        if (isCurrent) statusClass = "player-card-active";
        if (isCurrentBidder) statusClass = "player-card-bidder";

        let card = document.createElement('div');
        card.className = `custom-player-card transition-all duration-200 hover:scale-[1.02] cursor-pointer ${statusClass}`;
        card.setAttribute('onclick', `openHandModal(${p.player_id})`);

        card.innerHTML = `
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full ${isCurrent ? 'bg-yellow-600 animate-pulse' : (isCurrentBidder ? 'bg-purple-600 animate-pulse' : 'bg-gray-600')}"></span>
                    <span class="text-base font-black text-black">玩家 ${idx + 1} ${isCurrent ? '👑' : ''}</span>
                </div>
                <span class="text-xs px-2 py-0.5 rounded-full font-black bg-amber-500/50 text-black shadow-sm">💰 ${p.score} 分</span>
            </div>
            <div class="space-y-2 text-xs">
                <p class="text-black flex justify-between items-center p-1.5 rounded border border-black/10">
                    <span>擁有手牌板塊：</span>
                    <span class="font-bold text-black text-sm">${p.hand_count} 張 🔍</span>
                </p>
                <div class="pt-2 mt-1 border-t border-black/10 space-y-2">
                    <div>
                        <span class="block text-[10px] uppercase font-bold text-black tracking-wider mb-1">▶ 本時代可用籌碼</span>
                        <div class="flex flex-wrap gap-1 min-h-[22px]">
                            ${p.active_suns.map(s => `<span class="bg-black/10 text-black font-extrabold border border-black/30 px-2 py-0.5 rounded-md text-[10px] shadow-sm">${s}</span>`).join('') || '<span class="text-black italic text-[10px]">已無可用籌碼</span>'}
                        </div>
                    </div>
                    <div>
                        <span class="block text-[10px] uppercase font-bold text-black tracking-wider mb-1">⏳ 已翻面鎖定</span>
                        <div class="flex flex-wrap gap-1 min-h-[22px]">
                            ${p.used_suns.map(s => `<span class="bg-black/10 text-black border border-black/20 px-2 py-0.5 rounded-md text-[10px] line-through flex items-center gap-0.5">🔒 ${s}</span>`).join('') || '<span class="text-black italic text-[10px]">無</span>'}
                        </div>
                    </div>
                </div>
            </div>
        `;
        pBoard.appendChild(card);
    });

    // 4. 更新按鈕狀態
    const drawBtn = document.getElementById('btn-draw');
    const raBtn = document.getElementById('btn-call-ra');
    const godBtn = document.getElementById('btn-use-god');
    const disabledClass = "custom-orange-btn opacity-50 cursor-not-allowed";

    if (gameState.auction_active || isGodExchangeMode) {
        if (drawBtn) drawBtn.className = disabledClass;
        if (raBtn) raBtn.className = disabledClass;
        if (godBtn) {
            if (isGodExchangeMode) {
                godBtn.className = "custom-orange-btn bg-red-800";
                godBtn.innerText = "❌ 取消神明交換";
                godBtn.disabled = false;
            } else {
                godBtn.className = disabledClass;
                godBtn.disabled = true;
            }
        }
    } else {
        if (drawBtn) drawBtn.className = "custom-orange-btn";
        if (raBtn) raBtn.className = "custom-orange-btn";
        const curPlayerStruct = gameState.players[gameState.current_player];
        const hasGodTile = curPlayerStruct && curPlayerStruct.hand_tiles && curPlayerStruct.hand_tiles.some(t => t.type === 6);
        const hasAuctionItems = gameState.auction_track && gameState.auction_track.length > 0;
        if (godBtn) {
            godBtn.innerText = "🏛️ 使用神明板塊";
            if (hasGodTile && hasAuctionItems) {
                godBtn.className = "custom-orange-btn";
                godBtn.disabled = false;
            } else {
                godBtn.className = disabledClass;
                godBtn.disabled = true;
            }
        }
    }

    // 5. 檢查競標視窗狀態
    if (gameState.auction_active) {
        const modal = document.getElementById('auction-modal');
        if (modal && (modal.classList.contains('hidden') || modal.style.display === 'none' || window.getComputedStyle(modal).display === 'none')) {
            if (typeof openAuctionModal === "function") {
                openAuctionModal();
            }
        }
    }

    // 6. 新增：控制返回主選單按鈕的顯示/隱藏
    const menuBtn = document.getElementById('menu-btn-container');
    if (menuBtn) {
        if (gameState.auction_active) {
            menuBtn.classList.add('hidden');
        } else {
            menuBtn.classList.remove('hidden');
        }
    }
}

    async function drawTile() {
        if (gameState && gameState.auction_active) {
            alert(" 目前正處於太陽神競標程序中！請先完成出價，不可抽牌。");
            return;
        }

        let res = await fetch('/api/draw', { method: 'POST' });
        let data = await res.json();

        gameState = data.game_state;
        renderUI();

        if (gameState && gameState.auction_active) {
            if (gameState.auction_count >= 8) {
                alert("🚨 警告：拍賣軌道 8 格已滿！天神發怒，立刻強制進入大會競標程序！");
            }
            else if (data.drawn_tile && data.drawn_tile.type === 0) {
                alert(" 抽到太陽神 Ra 板塊！全體玩家請進入競標對話框出價！");
            }
            else if (gameState.forced_auction) {
                alert("🏛️ 太陽神事件觸發強制競標！");
            }

            if (typeof openAuctionModal === "function") {
                openAuctionModal();
            }
        }
    }

    async function callRa() {
        if (gameState && gameState.auction_active) {
            alert(" 目前已經在競標中了！");
            return;
        }

        let res = await fetch('/api/invoke_auction', { method: 'POST' });
        if (res.status === 400) { alert((await res.json()).error || "無法發起競標"); return; }
        let data = await res.json();

        gameState = data.game_state;
        renderUI();

        if (gameState.auction_active && typeof openAuctionModal === "function") {
            openAuctionModal();
        }
    }

    function useGodTile() {
        if (!gameState) return;
        if (gameState.auction_active) {
            alert(" 競標進行中，無法執行神明板塊特殊行動！");
            return;
        }

        isGodExchangeMode = !isGodExchangeMode;
        renderUI();
    }

    async function executeGodExchange(trackIndex, tileName) {
        const confirmUse = confirm(`🏛️ 確定要消耗一張「神明板塊」，來單獨換取拍賣區中的【${cleanTileName(tileName)}】嗎？\n(此行動經確認會立刻執行並結束你的回合)`);
        if (!confirmUse) return;

        try {
            let res = await fetch('/api/use_god_tile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    player_id: gameState.current_player,
                    track_index: parseInt(trackIndex, 10)
                })
            });

            let data = await res.json();
            if (res.ok && data.success) {
                alert(`🏛️ 神蹟顯靈！成功換取【${tileName}】！`);
                isGodExchangeMode = false;
                gameState = data.game_state;
                renderUI();
            } else {
                alert("❌ 行動失敗：" + (data.error || "不符合使用條件"));
                isGodExchangeMode = false;
                renderUI();
            }
        } catch (error) {
            console.error("Error using god tile:", error);
            alert("伺服器通訊錯誤，無法執行神明行動。");
            isGodExchangeMode = false;
            renderUI();
        }
    }

    async function returnToMainMenu() {
        const confirmLeave = confirm("⚠️ 確定要結束目前的遊戲並返回主畫面嗎？\n目前的遊戲進度將會遺失！");
        if (!confirmLeave) return;

        try {
            let res = await fetch('/api/restart', { method: 'POST' });
            let data = await res.json();
            if (data.status === "success") {
                window.location.href = '/';
            } else {
                alert("重置遊戲失敗：" + data.message);
            }
        } catch (error) {
            console.error("Error resetting game:", error);
            window.location.href = '/';
        }
    }

    async function submitSingleBid(playerId, bidAmount) {
        console.log(`發送出價請求：玩家 ${playerId}，金額 ${bidAmount}`);

        try {
            const response = await fetch('/api/submit_bid', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    player_id: parseInt(playerId),
                    bid_value: parseInt(bidAmount)
                })
            });

            const data = await response.json();

            if (response.ok && data.status === "success") {
                const wasAuctionActive = (gameState.auction_active !== 0);
                gameState = data.game_state;
                renderUI();

                const isAuctionJustEnded = (wasAuctionActive && gameState.auction_active === 0);

                if (isAuctionJustEnded) {
                    const auctionModal = document.getElementById('auction-modal');
                    if (auctionModal) auctionModal.classList.add('hidden');

                    window.showResultModal(gameState.highest_bidder, gameState.highest_bid);
                } else {
                    openAuctionModal();
                }
            } else {
                alert("出價失敗：" + (data.message || "未知錯誤"));
            }
        } catch (error) {
            console.error("Error submitting bid:", error);
            alert("無法連線至伺服器，請檢查後端日誌。");
        }
    }
</script>
{% endblock %}
